<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Wishlist</title>
</head>
<body>

    <header>
        <h1>Game Wishlist</h1>
        <div class="search-box">
            <input type="text" placeholder="Введіть назву гри...">
        </div>
        <div class="header-right">
            <button class="btn btn-login">Log In</button>
            <button class="btn btn-signup">Sign up</button>

            <div id="userProfile" class="user-profile" style="display: none;">
                <span id="userName" class="user-name"></span>
                <button id="dropdownToggle" class="dropdown-toggle">▼</button>
                <div id="dropdownMenu" class="dropdown-menu">
                    <button id="exitBtn" class="dropdown-item">Вийти</button>
                </div>
            </div>
        </div>    
    </header>

    <div class="page-layout">
        <aside class="filter-sidebar">
            <h2>Filters</h2>

            <div class="filters-group">
                <h3>Genre</h3>
                <label><input type="checkbox" value="action">Action</label>
                <label><input type="checkbox" value="RPG">RPG</label>
                <label><input type="checkbox" value="Strategy">Strategy</label>
                <label><input type="checkbox" value="Adventure">Adventure</label>
            </div>

            <div class="filters-group">
                <h3>Platform</h3>
                <label><input type="checkbox" value="PC">PC</label>
                <label><input type="checkbox" value="PlayStation">PlayStation</label>
                <label><input type="checkbox" value="Xbox">Xbox</label>
                <label><input type="checkbox" value="Nintendo">Nintendo</label>
            </div>

            <div class="filters-group">
                <h3>Sort by</h3>
                <select id="sort-select">
                    <option value="popular">Most popular</option>
                    <option value="release-date">Release date</option>
                    <option value="rating">Top Rated</option>
                    <option value="name">Name (A-Z)</option>
                </select>
            </div>
        </aside>

        <main class="main-container">
            <h2>All games</h2>
            <div class="games-container"></div>
            
            <div style="text-align: center; margin-top: 30px;">
                <button id="load-more-btn" class="btn" style="display: none;">Load More</button>
            </div>
        </main>
    </div>

    <div id="loginModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" data-close>&times;</span>
            <h2>Log In</h2>
            <form id="loginForm">
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn btn-login">Увійти</button>
            </form>
        </div>
    </div>

    <div id="signupModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" data-close>&times;</span>
            <h2>Sign Up</h2>
            <form id="signupForm">
                <input type="text" placeholder="Username" required>
                <input type="email" placeholder="Email" required>
                <input type="password" placeholder="Password" required>
                <button type="submit" class="btn btn-signup">Зареєструватися</button>
            </form>
        </div>
    </div>

    <div id="gameModal" class="modal-overlay">
        <div class="modal-content game-modal-content">
            <span class="close-btn" data-close>&times;</span>
            <div id="gameModalDetails">
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</body>
</html>
